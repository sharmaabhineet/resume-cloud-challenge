name: Deploy Resume Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION:         us-east-1
  TF_VAR_domain_name: sharmaabhineet.com
  TF_VAR_bucket_name: com.sharmaabhineet
  TF_VAR_subdomain:   portfolio
  TF_VAR_region:      us-east-1
  TF_VAR_to_email:    ${{ secrets.TF_VAR_TO_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Terraform Apply + Invalidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: true          # warn but don't block deploy
          quiet: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_id)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
